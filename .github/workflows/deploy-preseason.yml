name: Deploy Preseason Prototype

on:
  push:
    branches: [main]
    paths:
      - 'douglas-dynamics/preseason/web/**'
      - 'douglas-dynamics/preseason/reference/**'
      - '.github/workflows/deploy-preseason.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-preseason
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: douglas-dynamics/preseason/web/package-lock.json

      - name: Stage reference workbook for static hosting
        run: |
          mkdir -p "douglas-dynamics/preseason/web/public/reference"
          cp "douglas-dynamics/preseason/reference/Copy of 1.18 One Prep - 2024 WESTERN EOF.xlsx" \
            "douglas-dynamics/preseason/web/public/reference/"

      - name: Build web app
        working-directory: douglas-dynamics/preseason/web
        env:
          VITE_BASE_PATH: /prototypes/douglas-dynamics/preseason/site/
          VITE_STATIC_PROTOTYPE: 'true'
        run: |
          npm ci
          npm run build

      - name: Publish built site to main
        run: |
          rm -rf douglas-dynamics/preseason/site
          mkdir -p douglas-dynamics/preseason/site
          cp -r douglas-dynamics/preseason/web/dist/* douglas-dynamics/preseason/site/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add douglas-dynamics/preseason/site
          if git diff --staged --quiet; then
            echo "No site changes to publish"
          else
            git commit -m "Deploy preseason site to GitHub Pages [skip ci]"
            git push
          fi
