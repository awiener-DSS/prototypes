};
const prices={phx:189.99,ambulite:74.99,boxer:89.99,fastform:129.99,wrist:64.99};
const selections={}; const quantities={}; Object.keys(products).forEach(id=>{selections[id]={};quantities[id]=1});
const money=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});
const stage=document.getElementById('stage'),panel=document.getElementById('panel');
let active='fastform';
function positionPanel(id){
 const hs=document.querySelector(`[data-id="${id}"]`); const stageRect=stage.getBoundingClientRect(); const r=hs.getBoundingClientRect();
 const panelW=panel.offsetWidth||400; let left=(r.left-stageRect.left)+(r.width/2)-(panelW/2);
 left=Math.max(12,Math.min(left,stage.clientWidth-panelW-12)); panel.style.left=left+'px';
}
function switchProduct(id){
 if(id===active){positionPanel(id);return;} panel.classList.add('switching');
 setTimeout(()=>{active=id;render();document.querySelectorAll('.hotspot').forEach(h=>h.classList.toggle('active',h.dataset.id===id));positionPanel(id);panel.classList.remove('switching')},100);
}
function render(){
 const p=products[active], selected=selections[active], done=Object.keys(selected).length,total=p.groups.length,complete=done===total;
 panel.innerHTML=`<div class="panel-head"><div class="thumb"><img src="${p.image}" alt=""></div><div><div class="title">${p.name}</div><div class="sub">Choose all required options before adding this item to the cart.</div></div></div>
 <div class="progress-line"><span>Complete all required selections</span><span>${done} of ${total} selected</span></div><div class="bar"><span style="width:${done/total*100}%"></span></div>
 <div class="body">${p.groups.map((g,i)=>group(g,i,selected[g[0]])).join('')}<div class="notice ${complete?'success':''}">${complete?'✓ All selections complete. You can now add this item to your cart.':'ⓘ '+nextPrompt(p,selected)}</div></div>
 <div class="footer"><div><div class="qty-label">Quantity</div><div class="qty"><button data-q="-1">−</button><span>${quantities[active]}</span><button data-q="1">+</button></div></div><div><div class="price-label">Price</div><div class="price-box ${complete?'':'pending'}">${complete?money.format(prices[active]):'Select options'}</div></div><button class="add ${complete?'enabled':''}" ${complete?'':'disabled'}>${complete?'🛒 Add to Cart':`Select ${total-done} more option${total-done===1?'':'s'}`}</button></div>`;
 panel.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();selections[active][b.dataset.group]=b.dataset.value;render();positionPanel(active)}));
 panel.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();quantities[active]=Math.max(1,quantities[active]+Number(b.dataset.q));render();positionPanel(active)}));
 const add=panel.querySelector('.add.enabled'); if(add)add.addEventListener('click',()=>{const t=document.getElementById('toast');const totalPrice=prices[active]*quantities[active];t.textContent=`${quantities[active]} × ${p.name} added to cart — ${money.format(totalPrice)}`;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2100)});
}
function group(g,i,current){return `<section class="group"><div class="group-title"><span class="step">${i+1}</span>${g[0]} ${current?'':'<span class="req">• Required</span>'}</div><div class="choices">${g[1].map(v=>`<button class="choice ${current===v?'selected':''}" data-group="${g[0]}" data-value="${v}">${v}</button>`).join('')}</div></section>`}
function nextPrompt(p,s){const next=p.groups.find(g=>!s[g[0]]);return next?`Select ${next[0]} to continue.`:'All options selected.'}
document.querySelectorAll('.hotspot').forEach(h=>{h.addEventListener('mouseenter',()=>switchProduct(h.dataset.id));h.addEventListener('focus',()=>switchProduct(h.dataset.id));});
window.addEventListener('resize',()=>positionPanel(active));
render();document.querySelector('[data-id="fastform"]').classList.add('active');requestAnimationFrame(()=>positionPanel(active));
</script>
</body></html>
